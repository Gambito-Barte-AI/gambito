<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1006" viewBox="0 0 1440 1006" role="img" aria-label="Data Product Canvas do time Gambito para o fechamento da Tarvo">
<rect width="1440" height="1006" fill="#FFFFFF"/>
<rect width="1440" height="118" fill="#C81F52"/>
<text x="40" y="52" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" letter-spacing="2" fill="#FFFFFF" opacity=".85">DATA PRODUCT CANVAS · GAMBITO · DESAFIO BARTE AI</text>
<text x="40" y="90" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#FFFFFF">Fechamento mensal da Tarvo (setembro/2026)</text>
<text x="40" y="160" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="2" fill="#C81F52">VISÃO DE PRODUTO</text>
<text x="224" y="160" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#5E4C52">o que é o produto: problema, solução, dados e hipóteses</text>
<rect x="40.0" y="174" width="326.5" height="411" rx="14" fill="#FBF6F7" stroke="#E3D8DB" stroke-width="1.5"/>
<text x="60.0" y="208" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#E0426F">1</text>
<text x="80.0" y="209" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#C81F52">Problema</text>
<text x="60.0" y="238" font-family="Arial, Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#1A1114">O fechamento de setembro leva 8 dias</text>
<text x="60.0" y="258" font-family="Arial, Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#1A1114">úteis, depende de uma pessoa e só</text>
<text x="60.0" y="278" font-family="Arial, Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#1A1114">acha taxa errada quando o lojista</text>
<text x="60.0" y="298" font-family="Arial, Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#1A1114">reclama.</text>
<line x1="60.0" y1="314" x2="346.5" y2="314" stroke="#E3D8DB" stroke-dasharray="4 4"/>
<circle cx="66.0" cy="321.5" r="2.6" fill="#E0426F"/>
<text x="76.0" y="326" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#1A1114">De quem: do financeiro (duas analistas</text>
<text x="76.0" y="344" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#1A1114">e a responsável); quem sente é o</text>
<text x="76.0" y="362" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#1A1114">lojista e o CFO</text>
<circle cx="66.0" cy="380.5" r="2.6" fill="#E0426F"/>
<text x="76.0" y="385" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#1A1114">Por quê: 6 fontes sem chave comum (EC,</text>
<text x="76.0" y="403" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#1A1114">CNPJ, nome cortado)</text>
<circle cx="66.0" cy="421.5" r="2.6" fill="#E0426F"/>
<text x="76.0" y="426" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#1A1114">Por quê: sem cadastro de lojista nem</text>
<text x="76.0" y="444" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#1A1114">taxa com vigência</text>
<circle cx="66.0" cy="462.5" r="2.6" fill="#E0426F"/>
<text x="76.0" y="467" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#1A1114">Por quê: regras e acordos só na cabeça</text>
<text x="76.0" y="485" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#1A1114">das pessoas</text>
<circle cx="66.0" cy="503.5" r="2.6" fill="#E0426F"/>
<text x="76.0" y="508" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#1A1114">Causa raiz: sem identidade única de</text>
<text x="76.0" y="526" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#1A1114">lojista, e ninguém avisa a Orbe e a</text>
<text x="76.0" y="544" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#1A1114">Ponte quando o contrato muda</text>
<rect x="384.5" y="174" width="326.5" height="411" rx="14" fill="#FBF6F7" stroke="#E3D8DB" stroke-width="1.5"/>
<text x="404.5" y="208" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#E0426F">2</text>
<text x="424.5" y="209" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#C81F52">Solução</text>
<text x="404.5" y="238" font-family="Arial, Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#1A1114">Um comando que lê os arquivos do mês</text>
<text x="404.5" y="258" font-family="Arial, Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#1A1114">e devolve o fechamento com rastro até</text>
<text x="404.5" y="278" font-family="Arial, Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#1A1114">a linha de origem.</text>
<line x1="404.5" y1="294" x2="691.0" y2="294" stroke="#E3D8DB" stroke-dasharray="4 4"/>
<circle cx="410.5" cy="301.5" r="2.6" fill="#E0426F"/>
<text x="420.5" y="306" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#1A1114">Tipo: analytics com regras</text>
<text x="420.5" y="324" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#1A1114">determinísticas (não é machine</text>
<text x="420.5" y="342" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#1A1114">learning)</text>
<circle cx="410.5" cy="360.5" r="2.6" fill="#E0426F"/>
<text x="420.5" y="365" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#1A1114">Fluxo: ler → unir o lojista → aplicar</text>
<text x="420.5" y="383" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#1A1114">regras → saídas com rastro</text>
<circle cx="410.5" cy="401.5" r="2.6" fill="#E0426F"/>
<text x="420.5" y="406" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#1A1114">IA só em pontos estreitos; nunca</text>
<text x="420.5" y="424" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#1A1114">calcula valor</text>
<circle cx="410.5" cy="442.5" r="2.6" fill="#E0426F"/>
<text x="420.5" y="447" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#1A1114">O que a regra não resolve vira</text>
<text x="420.5" y="465" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#1A1114">pendência com dono</text>
<circle cx="410.5" cy="483.5" r="2.6" fill="#E0426F"/>
<text x="420.5" y="488" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#1A1114">Princípio: se não fecha, não sai</text>
<rect x="729.0" y="174" width="326.5" height="411" rx="14" fill="#FBF6F7" stroke="#E3D8DB" stroke-width="1.5"/>
<text x="749.0" y="208" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#E0426F">3</text>
<text x="769.0" y="209" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#C81F52">Dados</text>
<text x="749.0" y="238" font-family="Arial, Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#1A1114">Seis fontes, cada uma no formato do</text>
<text x="749.0" y="258" font-family="Arial, Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#1A1114">sistema que a exporta.</text>
<line x1="749.0" y1="274" x2="1035.5" y2="274" stroke="#E3D8DB" stroke-dasharray="4 4"/>
<circle cx="755.0" cy="281.5" r="2.6" fill="#E0426F"/>
<text x="765.0" y="286" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#1A1114">Orbe (CSV) · planilha de taxas (XLSX) ·</text>
<text x="765.0" y="304" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#1A1114">Ponte (e-mail com XLSX)</text>
<circle cx="755.0" cy="322.5" r="2.6" fill="#E0426F"/>
<text x="765.0" y="327" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#1A1114">Plano Fênix (CSV) · Aurora (CSV) ·</text>
<text x="765.0" y="345" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#1A1114">Meridiano (OFX)</text>
<circle cx="755.0" cy="363.5" r="2.6" fill="#E0426F"/>
<text x="765.0" y="368" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#1A1114">Chaves: id_transacao, EC, CNPJ, Nº da</text>
<text x="765.0" y="386" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#1A1114">operação, linha física, FITID</text>
<circle cx="755.0" cy="404.5" r="2.6" fill="#E0426F"/>
<text x="765.0" y="409" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#1A1114">Qualidade: CNPJ sem zero, % em texto,</text>
<text x="765.0" y="427" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#1A1114">vigência em texto, operação duplicada,</text>
<text x="765.0" y="445" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#1A1114">nomes truncados</text>
<rect x="1073.5" y="174" width="326.5" height="411" rx="14" fill="#FBF6F7" stroke="#E3D8DB" stroke-width="1.5"/>
<text x="1093.5" y="208" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#E0426F">4</text>
<text x="1113.5" y="209" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#C81F52">Hipóteses</text>
<text x="1093.5" y="238" font-family="Arial, Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#1A1114">O que precisa ser verdade para o</text>
<text x="1093.5" y="258" font-family="Arial, Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#1A1114">problema e a solução fazerem sentido.</text>
<line x1="1093.5" y1="274" x2="1380.0" y2="274" stroke="#E3D8DB" stroke-dasharray="4 4"/>
<circle cx="1099.5" cy="281.5" r="2.6" fill="#E0426F"/>
<text x="1109.5" y="286" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#1A1114">P1 O erro nasce de regra fora da</text>
<text x="1109.5" y="304" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#1A1114">planilha</text>
<circle cx="1099.5" cy="322.5" r="2.6" fill="#E0426F"/>
<text x="1109.5" y="327" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#1A1114">P2 A lentidão vem da falta de</text>
<text x="1109.5" y="345" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#1A1114">identidade única</text>
<circle cx="1099.5" cy="363.5" r="2.6" fill="#E0426F"/>
<text x="1109.5" y="368" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#1A1114">P3 Ninguém compara cobrado × contratado</text>
<circle cx="1099.5" cy="386.5" r="2.6" fill="#E0426F"/>
<text x="1109.5" y="391" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#1A1114">P4 Decisão não vira regra nem chega ao</text>
<text x="1109.5" y="409" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#1A1114">parceiro</text>
<circle cx="1099.5" cy="427.5" r="2.6" fill="#E0426F"/>
<text x="1109.5" y="432" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#1A1114">S1 Regras + identidade fecham com</text>
<text x="1109.5" y="450" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#1A1114">rastro R$ 0,00</text>
<circle cx="1099.5" cy="468.5" r="2.6" fill="#E0426F"/>
<text x="1109.5" y="473" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#1A1114">S2 A regra resolve quase tudo; a IA vem</text>
<text x="1109.5" y="491" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#1A1114">depois</text>
<circle cx="1099.5" cy="509.5" r="2.6" fill="#E0426F"/>
<text x="1109.5" y="514" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#1A1114">S3 A analista revisa pendências, não</text>
<text x="1109.5" y="532" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#1A1114">fontes</text>
<text x="40" y="637" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="2" fill="#C81F52">VISÃO DE ESTRATÉGIA</text>
<text x="251" y="637" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#5E4C52">o que fazer com ele: atores, ações e KPIs</text>
<rect x="40.0" y="651" width="441.3333333333333" height="289" rx="14" fill="#FBF6F7" stroke="#E3D8DB" stroke-width="1.5"/>
<text x="60.0" y="685" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#E0426F">5</text>
<text x="80.0" y="686" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#C81F52">Atores</text>
<text x="60.0" y="715" font-family="Arial, Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#1A1114">Quem patrocina, usa, aprova e é impactado.</text>
<line x1="60.0" y1="731" x2="461.3333333333333" y2="731" stroke="#E3D8DB" stroke-dasharray="4 4"/>
<circle cx="66.0" cy="738.5" r="2.6" fill="#E0426F"/>
<text x="76.0" y="743" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#1A1114">Sponsor: CFO da Tarvo</text>
<circle cx="66.0" cy="761.5" r="2.6" fill="#E0426F"/>
<text x="76.0" y="766" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#1A1114">Usuárias: as analistas do financeiro</text>
<circle cx="66.0" cy="784.5" r="2.6" fill="#E0426F"/>
<text x="76.0" y="789" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#1A1114">Aprova regra de fechamento: a responsável pelo</text>
<text x="76.0" y="807" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#1A1114">financeiro</text>
<circle cx="66.0" cy="825.5" r="2.6" fill="#E0426F"/>
<text x="76.0" y="830" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#1A1114">Aprova taxa e condição: o comercial</text>
<circle cx="66.0" cy="848.5" r="2.6" fill="#E0426F"/>
<text x="76.0" y="853" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#1A1114">Impactados: 25 lojistas e a contabilidade</text>
<circle cx="66.0" cy="871.5" r="2.6" fill="#E0426F"/>
<text x="76.0" y="876" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#1A1114">Externos: Orbe e Ponte Câmbio</text>
<circle cx="66.0" cy="894.5" r="2.6" fill="#E0426F"/>
<text x="76.0" y="899" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#1A1114">Papel vazio: quem avisa os parceiros</text>
<rect x="499.3333333333333" y="651" width="441.3333333333333" height="289" rx="14" fill="#FBF6F7" stroke="#E3D8DB" stroke-width="1.5"/>
<text x="519.3333333333333" y="685" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#E0426F">6</text>
<text x="539.3333333333333" y="686" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#C81F52">Ações</text>
<text x="519.3333333333333" y="715" font-family="Arial, Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#1A1114">O que a saída dispara no negócio.</text>
<line x1="519.3333333333333" y1="731" x2="920.6666666666666" y2="731" stroke="#E3D8DB" stroke-dasharray="4 4"/>
<circle cx="525.3333333333333" cy="738.5" r="2.6" fill="#E0426F"/>
<text x="535.3333333333333" y="743" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#1A1114">Devolver R$ 15.396,77 à Casa do Estudante</text>
<circle cx="525.3333333333333" cy="761.5" r="2.6" fill="#E0426F"/>
<text x="535.3333333333333" y="766" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#1A1114">Contestar a Orbe (Rota Global, Bridge) e a Ponte (Mundo</text>
<text x="535.3333333333333" y="784" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#1A1114">Aberto, spreads negativos, duplicata)</text>
<circle cx="525.3333333333333" cy="802.5" r="2.6" fill="#E0426F"/>
<text x="535.3333333333333" y="807" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#1A1114">Dar dono ao aviso de mudança de contrato</text>
<circle cx="525.3333333333333" cy="825.5" r="2.6" fill="#E0426F"/>
<text x="535.3333333333333" y="830" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#1A1114">Emitir as notas e lançar no Fênix</text>
<circle cx="525.3333333333333" cy="848.5" r="2.6" fill="#E0426F"/>
<text x="535.3333333333333" y="853" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#1A1114">Atlas: faturar só quando o comercial confirmar</text>
<rect x="958.6666666666666" y="651" width="441.3333333333333" height="289" rx="14" fill="#FBF6F7" stroke="#E3D8DB" stroke-width="1.5"/>
<text x="978.6666666666666" y="685" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#E0426F">7</text>
<text x="998.6666666666666" y="686" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#C81F52">KPIs</text>
<text x="978.6666666666666" y="715" font-family="Arial, Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#1A1114">Como saber que o produto funciona e gera valor.</text>
<line x1="978.6666666666666" y1="731" x2="1380.0" y2="731" stroke="#E3D8DB" stroke-dasharray="4 4"/>
<circle cx="984.6666666666666" cy="738.5" r="2.6" fill="#E0426F"/>
<text x="994.6666666666666" y="743" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#1A1114">100% dos números com rastro (diferença R$ 0,00)</text>
<circle cx="984.6666666666666" cy="761.5" r="2.6" fill="#E0426F"/>
<text x="994.6666666666666" y="766" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#1A1114">Precisão das divergências: 100% (zero alarme falso)</text>
<circle cx="984.6666666666666" cy="784.5" r="2.6" fill="#E0426F"/>
<text x="994.6666666666666" y="789" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#1A1114">Lançamentos por método: regra, IA ou pessoa</text>
<circle cx="984.6666666666666" cy="807.5" r="2.6" fill="#E0426F"/>
<text x="994.6666666666666" y="812" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#1A1114">Toda pendência com motivo e dono</text>
<circle cx="984.6666666666666" cy="830.5" r="2.6" fill="#E0426F"/>
<text x="994.6666666666666" y="835" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#1A1114">Tempo por etapa contra o baseline de 8 dias</text>
<text x="40" y="980" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5E4C52">Blocos revisados pelo time antes do checkpoint 1. A visão de negócio (valores, riscos e impacto) está descrita no texto. Framework: Data Product Canvas, de Leandro Carvalho.</text>
